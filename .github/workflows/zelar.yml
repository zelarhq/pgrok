# Zelar fork build. Upstream workflows are gated on github.repository == 'pgrok/pgrok'
# and never run here. Push a tag like v1.7.0-zelar.1 to publish:
#   - ghcr.io/zelarhq/pgrokd:1.7.0-zelar.1 (linux/amd64 — zelar-node-01)
#   - pgrok client binaries attached to the GitHub release
name: Zelar fork
on:
  push:
    tags: ['v*-zelar.*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Runs the real install.ps1 against a locally served build: the service must
  # survive past the SCM 30s start timeout, log to pgrok.log, restart after
  # being killed, and uninstall cleanly. Gates publishing the client.
  windows-service-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Build and serve the client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dl | Out-Null
          go build -o dl/pgrok_windows_amd64.exe ./pgrok/cli
          Start-Process python -ArgumentList "-m","http.server","18999","--directory","dl" -WindowStyle Hidden
          (Get-Content pgrokd/cli/internal/web/install/install.ps1 -Raw).
            Replace("__SERVER_URL__", "http://127.0.0.1:3320").
            Replace("__REMOTE_ADDR__", "127.0.0.1:1").
            Replace("__DOWNLOAD_URL__", "http://127.0.0.1:18999") | Set-Content install.ps1
          Start-Sleep 2
      - name: install.ps1 installs and starts the service
        shell: powershell # Windows PowerShell 5.1, what users have by default
        run: |
          & ([scriptblock]::Create((Get-Content install.ps1 -Raw))) -Token test-token -ForwardAddr 3000 -BasicAuth "alice:s3cret-pass"
          Start-Sleep 40
          $svc = Get-Service pgrok
          if ($svc.Status -ne "Running") { throw "service not running after 40s: $($svc.Status)" }
          if ((Get-CimInstance Win32_Service -Filter "Name='pgrok'").StartMode -ne "Auto") { throw "service is not set to start automatically" }
          $log = Join-Path $env:USERPROFILE ".pgrok\pgrok.log"
          Get-Content $log -Tail 5
          if (-not (Select-String -Path $log -Pattern "Failed to connect" -Quiet)) { throw "expected reconnect attempts in $log" }
      - name: Service restarts after being killed
        shell: powershell
        run: |
          $before = (Get-CimInstance Win32_Service -Filter "Name='pgrok'").ProcessId
          Stop-Process -Id $before -Force
          Start-Sleep 15
          $after = (Get-CimInstance Win32_Service -Filter "Name='pgrok'").ProcessId
          if ((Get-Service pgrok).Status -ne "Running" -or $after -eq $before -or $after -eq 0) { throw "service did not restart ($before -> $after)" }
      - name: Uninstall
        shell: powershell
        run: |
          & "$env:ProgramFiles\pgrok\pgrok.exe" service uninstall
          if (Get-Service pgrok -ErrorAction SilentlyContinue) { throw "service still installed" }

  pgrokd-image:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "IMAGE_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          build-args: BUILD_VERSION=${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/zelarhq/pgrokd:${{ env.IMAGE_TAG }}

  pgrok-client:
    needs: windows-service-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          set -eu
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-X main.version=${GITHUB_REF_NAME#v}" \
              -o "dist/pgrok_${os}_${arch}${ext}" ./pgrok/cli
          done
          (cd dist && sha256sum * > checksums.txt)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file ZELAR.md
